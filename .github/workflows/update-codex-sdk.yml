name: Update Codex SDK

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-codex-sdk
  cancel-in-progress: false

jobs:
  update:
    name: Update @openai/codex-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Update Codex SDK
        id: update
        run: |
          current_version="$(node -p 'require("./packages/codex-relay/package.json").dependencies["@openai/codex-sdk"]')"
          latest_version="$(pnpm view @openai/codex-sdk@latest version)"

          if [[ "$current_version" == "$latest_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm --filter codex-relay add "@openai/codex-sdk@$latest_version" --save-exact --lockfile-only
          changeset_path=".changeset/update-codex-sdk-$latest_version.md"
          printf -- '---\n"codex-relay": patch\n---\n\nUpdate `@openai/codex-sdk` to `%s`.\n' "$latest_version" > "$changeset_path"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "changeset=$changeset_path" >> "$GITHUB_OUTPUT"
          echo "version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Install updated dependencies
        if: steps.update.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: pnpm test

      - name: Typecheck
        if: steps.update.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.update.outputs.changed == 'true'
        run: pnpm lint

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        env:
          CHANGESET_PATH: ${{ steps.update.outputs.changeset }}
          CODEX_SDK_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHANGESET_PATH" packages/codex-relay/package.json pnpm-lock.yaml
          git commit -m "chore: update @openai/codex-sdk to $CODEX_SDK_VERSION"
          git push origin HEAD:main

      - name: Trigger release workflow
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
